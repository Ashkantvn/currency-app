services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev

    ports:
      - "8000:8000"

    volumes:
      - ../core:/app/core

    env_file:
      - ../env/.env.dev

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:19

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    env_file:
      - ../env/.env.dev

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: